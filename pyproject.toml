[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "faust-threads-mcp"
version = "0.3.0"
description = "Standalone MCP server for the official Threads API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.13,<2"]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-cov>=5.0"]
quality = ["ruff>=0.9", "mypy>=1.13", "bandit>=1.8"]

[project.scripts]
faust-threads-mcp = "faust_threads_mcp.threads_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/faust_threads_mcp"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
strict = true
python_version = "3.11"

[tool.coverage.run]
branch = true
source = ["src/faust_threads_mcp"]

[tool.coverage.report]
fail_under = 100
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
